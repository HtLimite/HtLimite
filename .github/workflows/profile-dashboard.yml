name: Generate Profile Dashboard

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-dashboard.yml"
      - "scripts/generate_dashboard.py"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate dashboard generator
        run: python3 scripts/generate_dashboard.py --self-test
      - name: Generate profile dashboard SVG
        env:
          DASHBOARD_USER: HtLimite
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_dashboard.py
      - name: Commit generated dashboard
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): update github dashboard"
          file_pattern: assets/github-profile-stats.svg assets/top-languages.svg assets/github-streak.svg assets/github-trophy.svg assets/contribution-activity.svg
